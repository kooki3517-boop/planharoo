<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f3f0"><title>하루 계획</title><style>
:root{--bg:#f7f3f0;--card:#fbf9f7;--line:#e9e1de;--ink:#252321;--muted:#aaa3a0;--rose:#cdb6ba;--rose2:#eee4e5;--red:#f00000}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:22px 18px 100px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.top h1{font-size:28px;margin:0;flex:1;font-weight:800}.icon{border:0;background:transparent;color:#898482;font-size:24px;padding:8px}.dayPager{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -18px;padding:2px 18px 14px}.dayPager::-webkit-scrollbar{display:none}.dayPage{flex:0 0 calc(100vw - 36px);max-width:484px;scroll-snap-align:center}.dayDate{font-size:14px;color:#77716e;margin:3px 3px 12px}.dayHint{text-align:center;color:#b1aaa7;font-size:12px;margin:0 0 9px}.dateStrip{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding:2px 1px 12px}.dateStrip::-webkit-scrollbar{display:none}.day{min-width:68px;border:1px solid var(--line);background:rgba(255,255,255,.36);border-radius:15px;padding:10px 7px;text-align:center;color:#918b88}.day b{display:block;font-size:18px;color:#696462;margin-top:3px}.day.active{background:var(--rose2);border-color:#ddcacc}.day.active b{color:#7e666a}.dateLine{display:flex;align-items:center;justify-content:space-between;margin:5px 2px 14px;color:#6f6a68;font-size:14px}.card{background:rgba(255,255,255,.48);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:13px}.progressHead,.sectionHead{display:flex;align-items:center;justify-content:space-between}.progressHead strong{font-size:17px}.count{font-size:13px;color:#9d9693}.bar{height:7px;border-radius:9px;background:#eee8e5;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--rose);border-radius:9px}.sectionHead{margin-bottom:9px}.sectionHead h2{font-size:16px;margin:0}.task{display:grid;grid-template-columns:30px 1fr 30px 30px;gap:6px;align-items:center;min-height:48px;border-top:1px solid #eee8e5}.task:first-of-type{border-top:0}.check{width:23px;height:23px;border:1px solid #c7bfbc;border-radius:6px;background:#fff;color:white}.check.on{background:#cdb6ba;border-color:#cdb6ba}.task.done .txt{text-decoration:line-through;color:#b6afac}.txt{font-size:15px}.miniBtn{border:0;background:none;color:#aaa3a0;font-size:18px}.add{width:100%;border:1px dashed #dfd5d2;background:rgba(255,255,255,.28);border-radius:16px;padding:16px;color:#9f9895;font-size:15px}.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(250,247,245,.96);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}.tabs button{width:min(50%,260px);border:0;background:none;padding:12px 4px calc(14px + env(safe-area-inset-bottom));color:#aaa3a0;font-size:14px}.tabs .active{color:#aa858c;border-bottom:4px solid #c6a5ab}.hidden{display:none}.month{width:100%;border:1px solid var(--line);background:#f0ebe8;border-radius:15px;padding:14px 16px;color:#77706d;font-size:16px;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.historyCard{border:1px solid var(--line);background:rgba(255,255,255,.43);border-radius:17px;padding:14px;min-height:145px}.historyCard h3{font-size:16px;margin:0 0 8px}.histLine{font-size:12px;color:#918a87;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.7}.histScore{text-align:right;color:#aaa3a0;font-size:12px;margin-top:7px}.note{font-size:13px;line-height:1.55;color:#928b88;background:#f0eae7;border-radius:15px;padding:14px;margin-bottom:14px}.routineRow{display:grid;grid-template-columns:24px 28px 1fr 30px 30px;gap:6px;align-items:center;min-height:52px;border-bottom:1px solid #eee8e5}.drag{color:#b7b0ad}.success{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;pointer-events:none;background:transparent}.success.show{display:flex}.success span{font-weight:1000;font-size:clamp(54px,17vw,100px);color:var(--red);letter-spacing:1px;text-shadow:0 1px 0 rgba(255,255,255,.5)}.confetti{position:fixed;z-index:101;top:-25px;width:9px;height:15px;animation:fall 1.7s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(800deg)}}.flash{position:fixed;inset:0;z-index:200;display:none;background:#111;align-items:center;justify-content:center}.flash.show{display:flex}.flash img{width:100%;height:100%;object-fit:cover}.empty{color:#aaa3a0;font-size:14px;padding:8px 0}.back{font-size:28px}.manageTitle{margin-bottom:8px}@media(max-width:380px){.app{padding-left:14px;padding-right:14px}.top h1{font-size:25px}}
</style></head><body><main class="app">
<section id="today"><div class="top"><h1>하루 계획</h1><button class="icon" id="calendarBtn" aria-label="달력">▣</button><button class="icon" onclick="showManage()" aria-label="고정 루틴 관리">⚙</button></div><div id="dayPager" class="dayPager" aria-label="날짜별 하루 계획"></div><input id="datePicker" type="date" style="position:absolute;opacity:0;pointer-events:none"></section>
<section id="history" class="hidden"><div class="top"><h1>지난 기록</h1></div><input id="month" class="month" type="month"><div id="historyGrid" class="grid"></div></section>
<section id="manage" class="hidden"><div class="top manageTitle"><button class="icon back" onclick="show('today')">‹</button><h1>고정 루틴 관리</h1></div><div class="note">여기에서 정한 항목은 새로운 날짜를 만들 때마다 항상 상단에 표시됩니다. 기존 기록에는 영향을 주지 않습니다.</div><div id="routineManage" class="card"></div><button class="add" onclick="addRoutine()">＋ 새 고정 루틴 추가하기</button></section>
</main><nav id="tabs" class="tabs"><button id="tabToday" class="active" onclick="show('today')">⌂<br>오늘 계획</button><button id="tabHistory" onclick="show('history')">▣<br>지난 기록</button></nav><div id="success" class="success"><span>SUCCESS!</span></div><div id="flash" class="flash"><img id="flashImg" alt=""></div>
<script>
const PHOTOS=['34450.jpg','34794.jpg','38062.jpg','39653.jpg','40251.jpg','5309.jpg','50776.jpg','50805.jpg','51420.jpg','58412.jpg','57339.jpg','57077.jpg','57061.jpg'];
const K='planharoo-v2';let state=JSON.parse(localStorage.getItem(K)||'null')||{routines:['영양제 챙겨 먹기','물 2L 마시기','책 30분 읽기','운동하기'],days:{}};let selected=key(new Date());
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function parse(k){let[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)}function save(){localStorage.setItem(K,JSON.stringify(state))}
function ensure(k){if(!state.days[k]){state.days[k]={routines:state.routines.map(x=>({text:x,done:false})),daily:[]};save()}return state.days[k]}
function beep(type='tap'){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=type==='done'?620:420;g.gain.setValueAtTime(.035,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.08);o.start();o.stop(a.currentTime+.08)}catch(e){}}
function offsetKey(base,n){let d=parse(base);d.setDate(d.getDate()+n);return key(d)}
function pageHTML(k){let d=ensure(k),dt=parse(k),all=[...d.routines,...d.daily],done=all.filter(x=>x.done).length;return `<article class="dayPage" data-date="${k}"><div class="dayDate">${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일 (${['일','월','화','수','목','금','토'][dt.getDay()]})</div><div class="card"><div class="progressHead"><strong>${dt.getMonth()+1}월 ${dt.getDate()}일</strong><span class="count">${done}/${all.length}</span></div><div class="bar"><i style="width:${all.length?done/all.length*100:0}%"></i></div></div><div class="card">${section('고정 루틴',d.routines,'routines',k)}</div><div class="card">${section('오늘만 할 일',d.daily,'daily',k)}</div><button class="add" onclick="addDaily('${k}')">＋ 오늘만 할 일 추가하기</button></article>`}
function selectDate(k){selected=k;ensure(k);render()}
function render(){let ks=[];for(let i=-2;i<=2;i++)ks.push(offsetKey(selected,i));dayPager.innerHTML=ks.map(pageHTML).join('');requestAnimationFrame(()=>{dayPager.children[2]?.scrollIntoView({inline:'center',block:'nearest'})})}
let swipeTimer;dayPager.addEventListener('scroll',()=>{clearTimeout(swipeTimer);swipeTimer=setTimeout(()=>{let r=dayPager.getBoundingClientRect(),cx=r.left+r.width/2,best=null,dist=1e9;[...dayPager.children].forEach(el=>{let q=el.getBoundingClientRect(),d=Math.abs((q.left+q.width/2)-cx);if(d<dist){dist=d;best=el}});if(best&&best.dataset.date!==selected){selected=best.dataset.date;ensure(selected);render()}},120)});
function section(title,arr,type,k=selected){let n=arr.filter(x=>x.done).length;return `<div class="sectionHead"><h2>${title}</h2><span class="count">${n}/${arr.length}</span></div>${arr.length?arr.map((x,i)=>`<div class="task ${x.done?'done':''}"><button class="check ${x.done?'on':''}" onclick="toggle('${type}',${i},'${k}')">${x.done?'✓':''}</button><span class="txt">${esc(x.text)}</span><button class="miniBtn" onclick="editItem('${type}',${i},'${k}')">✎</button><button class="miniBtn" onclick="delItem('${type}',${i},'${k}')">×</button></div>`).join(''):'<div class="empty">등록된 항목이 없습니다.</div>'}`}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toggle(type,i,k=selected){selected=k;let d=ensure(k);d[type][i].done=!d[type][i].done;save();beep(d[type][i].done?'done':'tap');render();let all=[...d.routines,...d.daily];if(all.length&&all.every(x=>x.done))celebrate()}
function editItem(type,i,k=selected){selected=k;let d=ensure(k),v=prompt('내용 수정',d[type][i].text);if(v&&v.trim()){d[type][i].text=v.trim();save();render()}}
function delItem(type,i,k=selected){selected=k;let d=ensure(k);if(confirm('삭제할까요?')){d[type].splice(i,1);save();render()}}
function addDaily(k=selected){selected=k;let v=prompt('오늘만 할 일을 입력하세요.');if(v&&v.trim()){ensure(k).daily.push({text:v.trim(),done:false});save();beep();render()}}
function show(id){['today','history','manage'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));tabs.style.display=id==='manage'?'none':'flex';tabToday.classList.toggle('active',id==='today');tabHistory.classList.toggle('active',id==='history');if(id==='today')render();if(id==='history')renderHistory();if(id==='manage')renderManage()}
function showManage(){show('manage')}
function renderManage(){routineManage.innerHTML=state.routines.length?state.routines.map((x,i)=>`<div class="routineRow"><span class="drag">☷</span><span>□</span><span>${esc(x)}</span><button class="miniBtn" onclick="editRoutine(${i})">✎</button><button class="miniBtn" onclick="deleteRoutine(${i})">×</button></div>`).join(''):'<div class="empty">등록된 고정 루틴이 없습니다.</div>'}
function addRoutine(){let v=prompt('새 고정 루틴을 입력하세요.');if(v&&v.trim()){state.routines.push(v.trim());save();beep();renderManage()}}
function editRoutine(i){let v=prompt('고정 루틴 수정',state.routines[i]);if(v&&v.trim()){state.routines[i]=v.trim();save();renderManage()}}
function deleteRoutine(i){if(confirm('이 고정 루틴을 삭제할까요?')){state.routines.splice(i,1);save();renderManage()}}
function renderHistory(){let m=month.value||selected.slice(0,7);month.value=m;let ks=Object.keys(state.days).filter(k=>k.startsWith(m)).sort().reverse();historyGrid.innerHTML=ks.length?ks.map(k=>{let d=state.days[k],all=[...d.routines,...d.daily],n=all.filter(x=>x.done).length,dt=parse(k);return `<div class="historyCard" onclick="selected='${k}';show('today')"><h3>${dt.getMonth()+1}.${dt.getDate()} (${['일','월','화','수','목','금','토'][dt.getDay()]})</h3>${all.slice(0,5).map(x=>`<div class="histLine">${x.done?'✓':'□'} ${esc(x.text)}</div>`).join('')}<div class="histScore">${n}/${all.length}</div></div>`}).join(''):'<div class="empty">기록이 없습니다.</div>'}
month.addEventListener('change',renderHistory);calendarBtn.onclick=()=>{datePicker.value=selected;datePicker.showPicker?datePicker.showPicker():datePicker.click()};datePicker.onchange=()=>selectDate(datePicker.value);
function celebrate(){success.classList.add('show');beep('done');try{let a=new (window.AudioContext||window.webkitAudioContext)();[0,80,150,230].forEach((ms,j)=>setTimeout(()=>{let o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=[523,659,784,1047][j];g.gain.setValueAtTime(.05,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.22);o.start();o.stop(a.currentTime+.22)},ms))}catch(e){}for(let i=0;i<55;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=`hsl(${Math.random()*360} 65% 65%)`;c.style.animationDelay=Math.random()*.45+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2400)}setTimeout(()=>success.classList.remove('show'),1900)}
ensure(selected);render();if(Math.random()<.05){flashImg.src='assets/'+PHOTOS[Math.floor(Math.random()*PHOTOS.length)];flash.classList.add('show');setTimeout(()=>flash.classList.remove('show'),700)}
</script></body></html>
