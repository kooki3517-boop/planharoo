<script>
const SUPABASE_URL="https://owliextjtdyjumswcdtw.supabase.co";
const SUPABASE_KEY="sb_publishable_5sEMTCvftCD4ImO51u6DBg_7D3lR3Kt";

let currentUser=null,saveTimer=null,saveRunning=false,savePending=false;
let saveRevision=0,saveRetryTimer=null,saveFailureShown=false;
const pendingKey=()=>currentUser?"planharoo-pending-"+currentUser.id:null;
function readPending(){try{const v=localStorage.getItem(pendingKey());return v?JSON.parse(v):null}catch(e){return null}}
function storePending(snapshot){try{localStorage.setItem(pendingKey(),JSON.stringify(snapshot));return true}catch(e){console.error("임시 저장 실패:",e);return false}}
function clearPending(){try{localStorage.removeItem(pendingKey())}catch(e){}}
const DEFAULTS=["일어나서 영양제 챙겨 먹기","8시간 자기","감사 일기 쓰기","명상하기","독서하기 (10분 이상)","운동하기","건강식 한 끼","가계부 쓰기"];
const $=s=>document.querySelector(s), main=$("#main");
function freshData(){return {routines:DEFAULTS.map((t,i)=>({id:"r"+i,t,on:true})),days:{},recent:{}}}
let data=freshData();
function save(){
 if(!currentUser)return;
 saveRevision++;
 const backedUp=storePending(data);
 if(!backedUp&&!saveFailureShown){saveFailureShown=true;alert("기기에 임시 저장하지 못했습니다. 저장 공간을 확인해 주세요.")}
 clearTimeout(saveTimer);
 clearTimeout(saveRetryTimer);
 saveTimer=setTimeout(flushSave,180);
}
let saveInFlight=null;
async function flushSave(){
 if(!currentUser)return false;
 clearTimeout(saveTimer);
 clearTimeout(saveRetryTimer);
 if(saveInFlight){
  await saveInFlight;
  if(!readPending())return true;
  // Wait for the current request before sending the newest snapshot.
 }
 const userId=currentUser.id;
 const revision=saveRevision;
 const snapshot=JSON.parse(JSON.stringify(data));
 saveInFlight=(async()=>{
  try{
   const {error}=await sb.from("plans").upsert({user_id:userId,plan_date:"1970-01-01",data:snapshot},{onConflict:"user_id,plan_date"});
   if(error)throw error;
   if(currentUser?.id===userId&&revision===saveRevision){clearPending();saveFailureShown=false}
   return true;
  }catch(error){
   console.error("저장 실패:",error);
   if(!saveFailureShown){saveFailureShown=true;alert("서버 저장에 실패했습니다. 변경 내용은 이 기기에 임시 보관하고 자동으로 다시 저장합니다.")}
   return false;
  }

 const ok=await saveInFlight;
 saveInFlight=null;
 if(currentUser?.id!==userId)return false;
 if(!ok){saveRetryTimer=setTimeout(()=>{if(readPending())flushSave()},3000);return false}
 if(revision!==saveRevision)return flushSave();

async function saveAndReturn(button){
 if(button.disabled)return;
 button.disabled=true;
 const previous=button.textContent;
 button.textContent="저장 중...";
 try{
  // Include any unsent changes and require a confirmed cloud write.

  if(ok){renderHome();return}
  alert("저장에 실패했습니다. 메인으로 이동하지 않았어요. 인터넷 연결을 확인하고 다시 눌러 주세요.");
 }finally{
  button.disabled=false;
  button.textContent=previous;
 }
}
window.addEventListener("online",()=>{if(currentUser&&readPending())flushSave()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&currentUser&&readPending())flushSave()});

// Keep one browser-history guard for editable screens. A hardware back gesture
// confirms the same cloud save as the on-screen return button.
let editScreen=null, backSaving=false, swipeAnimating=false;
function guardEditScreen(type){
 // Push only when entering an editor from a non-editor screen.
 // Re-rendering the same editor (checkboxes etc.) must not add history entries.
 if(!editScreen){
  history.pushState({planEditGuard:true},"",location.href);
 }
 editScreen=type;
}
window.addEventListener("popstate",async()=>{
 if(!editScreen||!currentUser)return;
 // The browser has already stepped back. Restore an in-app history entry
 // immediately so a failed save cannot close the web shortcut.
 history.pushState({planEditGuard:true},"",location.href);
 if(backSaving)return;
 backSaving=true;
 try{
  const ok=await flushSave();
  if(ok){renderHome()}
  else alert("저장에 실패했습니다. 현재 화면을 유지합니다. 인터넷 연결을 확인하고 다시 시도해 주세요.");
 }finally{backSaving=false}
});
function enableDaySwipe(k){
 const screen=main.querySelector(".screen");
 if(!screen)return;
 let startX=0,startY=0,tracking=false;
 screen.addEventListener("touchstart",e=>{
  if(e.touches.length!==1||e.target.closest("button,input")){tracking=false;return}
  tracking=true;startX=e.touches[0].clientX;startY=e.touches[0].clientY;
 },{passive:true});
 screen.addEventListener("touchend",async e=>{
  if(!tracking||swipeAnimating||!e.changedTouches.length)return;
  tracking=false;
  const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;
  if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.5)return;
  const dates=Object.keys(data.days).sort();
  const pos=dates.indexOf(k);
  const target=dates[pos+(dx<0?1:-1)];
  if(!target)return;
  swipeAnimating=true;
  try{
   const ok=await flushSave();
   if(!ok){
    alert("저장에 실패해 날짜를 이동하지 않았어요. 다시 시도해 주세요.");
    return;
   }
   // Visibly slide the outgoing date card and bring the next card in.
   const direction=dx<0?-1:1;
   screen.style.willChange="transform, opacity";
   screen.style.transition="transform 170ms ease-in, opacity 170ms ease-in";
   screen.style.transform=`translateX(${direction*100}%)`;
   screen.style.opacity=".35";
   await new Promise(resolve=>setTimeout(resolve,175));
   renderDetail(target);
   const incoming=main.querySelector(".screen");
   if(!incoming)return;
   incoming.style.willChange="transform, opacity";
   incoming.style.transition="none";
   incoming.style.transform=`translateX(${-direction*100}%)`;
   incoming.style.opacity=".35";
   // Two frames ensure the browser paints the starting position.
   await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
   incoming.style.transition="transform 220ms ease-out, opacity 220ms ease-out";
   incoming.style.transform="translateX(0)";
   incoming.style.opacity="1";
   await new Promise(resolve=>setTimeout(resolve,230));
   incoming.style.transition="";
   incoming.style.transform="";
   incoming.style.opacity="";
   incoming.style.willChange="";
  }finally{swipeAnimating=false}
 },{passive:true});
}
// A carried task exists on exactly one date. Never create intermediate dates.
function carryToToday(next,makeToday=false){
 const today=key(new Date());
 if(!next.days[today]){
  if(!makeToday)return false;
  next.days[today]={routineDone:{},tasks:[]};
 }
 let moved=false;
 for(const day of Object.keys(next.days).sort()){
  if(day>=today)continue;
  const source=next.days[day];
  if(!Array.isArray(source.tasks))continue;
  const staying=[];
  for(const task of source.tasks){
   if(task.carry===true&&!task.done){
    next.days[today].tasks.push(task);
    moved=true;
   }else staying.push(task);
  }
  source.tasks=staying;
 }
 if(moved)next.recent[today]=Date.now();
 return moved;
}
async function confirmCarryMutation(mutator){
 if(modalBusy)return false;
 // Finish any queued edits before sending a full new snapshot.

  alert("이전 변경 내용을 저장하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.");
  return false;
 }
 const next=JSON.parse(JSON.stringify(data));
 if(mutator(next)===false)return false;
 const userId=currentUser?.id;
 if(!userId)return false;
 try{
  const {error}=await sb.from("plans").upsert({user_id:userId,plan_date:"1970-01-01",data:next},{onConflict:"user_id,plan_date"});
  if(error)throw error;
  if(currentUser?.id!==userId)throw Error("account changed");
  data=next;
  clearPending();saveFailureShown=false;
  return true;
 }catch(e){
  console.error("이어가기 저장 실패",e);
  alert("저장하지 못했습니다. 인터넷 연결을 확인한 후 다시 시도해 주세요.");
  return false;
 }
}
let carryMenu=null,carryMenuBusy=false;
function hideCarryMenu(){

}
function openCarryMenu(row,k,i){

 if(!carryMenu){

   if(carryMenu&&!carryMenu.contains(e.target))hideCarryMenu();

 }

 if(!task||task.done||task.carry)return;

}
function attachCarryLongPress(k){
 main.querySelectorAll("#ts .task").forEach((row,i)=>{
  let timer=null,originX=0,originY=0;
  const cancel=()=>{clearTimeout(timer);timer=null};
  row.addEventListener("pointerdown",e=>{
   if(e.target.closest("button,input")||data.days[k]?.tasks?.[i]?.done)return;
   originX=e.clientX;originY=e.clientY;
   cancel();
   timer=setTimeout(()=>{timer=null;openCarryMenu(row,k,i)},550);
  });
  row.addEventListener("pointermove",e=>{
   if(Math.abs(e.clientX-originX)>12||Math.abs(e.clientY-originY)>12)cancel();
  });
  row.addEventListener("pointerup",cancel);
  row.addEventListener("pointercancel",cancel);
  row.addEventListener("pointerleave",cancel);
  row.addEventListener("contextmenu",e=>{
   if(e.target.closest("button,input"))return;
   e.preventDefault();cancel();openCarryMenu(row,k,i);
  });
 });
}
function touchDay(k){data.recent[k]=Date.now();save()}
const pad=n=>String(n).padStart(2,"0"), key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function dayData(k){if(!data.days[k]) data.days[k]={routineDone:{},tasks:[]};return data.days[k]}

function counts(k){let d=dayData(k),r=activeR(),done=r.filter(x=>d.routineDone[x.id]).length+d.tasks.filter(x=>x.done).length,total=r.length+d.tasks.length;return [done,total]}
let ctx;
function audio(){ctx ||= new (window.AudioContext||window.webkitAudioContext)();return ctx}
function tone(freq=660,d=.09,vol=.22){try{let c=audio(),t=c.currentTime;
let b=c.createBuffer(1,Math.floor(c.sampleRate*.07),c.sampleRate),a=b.getChannelData(0);
for(let i=0;i<a.length;i++){let x=i/a.length;a[i]=(Math.random()*2-1)*Math.pow(1-x,5)}
let s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type="bandpass";f.frequency.value=1450;f.Q.value=1.8;g.gain.value=.48;s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);
let o=c.createOscillator(),og=c.createGain();o.type="square";o.frequency.setValueAtTime(165,t);o.frequency.exponentialRampToValueAtTime(90,t+.045);og.gain.setValueAtTime(.16,t);og.gain.exponentialRampToValueAtTime(.001,t+.055);o.connect(og);og.connect(c.destination);o.start(t);o.stop(t+.06)
}catch(e){}}
function cheer(){try{let c=audio(),t=c.currentTime;for(let j=0;j<14;j++){let o=c.createOscillator(),g=c.createGain();o.type="triangle";o.frequency.value=300+Math.random()*700;g.gain.setValueAtTime(.10,t+j*.018);g.gain.exponentialRampToValueAtTime(.001,t+.8+Math.random()*.5);o.connect(g);g.connect(c.destination);o.start(t+j*.018);o.stop(t+1.4)}for(let j=0;j<9;j++){let b=c.createBuffer(1,c.sampleRate*.09,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);let s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=.24;s.connect(g);g.connect(c.destination);s.start(t+.12+j*.13)}}catch(e){}}

// Modal confirmations save the proposed change before closing the dialog.
let modalBusy=false;
async function commitModalChange(mutator, button){
 if(modalBusy)return false;
 modalBusy=true;
 const oldText=button.textContent;
 button.disabled=true;button.textContent="저장 중...";
 try{
  // Complete earlier queued writes before applying this new edit.
  if(readPending() && !(await flushSave()))throw new Error("pending save failed");
  const next=JSON.parse(JSON.stringify(data));
  if(mutator(next)===false)return false;
  const userId=currentUser?.id;
  if(!userId)throw new Error("not signed in");
  const {error}=await sb.from("plans").upsert({user_id:userId,plan_date:"1970-01-01",data:next},{onConflict:"user_id,plan_date"});
  if(error)throw error;
  if(currentUser?.id!==userId)throw new Error("user changed");
  data=next;
  clearPending();saveFailureShown=false;
  return true;
 }catch(err){console.error("팝업 저장 실패:",err);alert("저장하지 못했습니다. 인터넷 연결을 확인한 후 다시 눌러 주세요.");return false}
 finally{modalBusy=false;button.disabled=false;button.textContent=oldText}
}

let statMonth=new Date(); statMonth.setDate(1);
function monthKeys(d){
 let y=d.getFullYear(),m=d.getMonth(),last=new Date(y,m+1,0).getDate(),arr=[];
 for(let n=1;n<=last;n++)arr.push(`${y}-${pad(m+1)}-${pad(n)}`); return arr;
}
function renderStats(){
 $("#appTitle").className="homeQuote";$("#appTitle").textContent="“나는 계획이 다 있구나.”";
 let keys=monthKeys(statMonth), existing=keys.filter(k=>data.days[k]), checked=0,total=0,successDays=0;
 let routineCounts={}; data.routines.forEach(r=>routineCounts[r.id]={name:r.t,done:0,possible:0});
 for(let k of existing){
   let dd=data.days[k], c=counts(k); checked+=c[0]; total+=c[1]; if(c[1]>0&&c[0]===c[1])successDays++;
   for(let r of data.routines){ if(r.on){routineCounts[r.id].possible++; if(dd.routineDone?.[r.id])routineCounts[r.id].done++;} }
 }
 let pct=total?Math.round(checked/total*100):0;
 let ranks=Object.values(routineCounts).filter(x=>x.possible>0).sort((a,b)=>b.done-a.done);
 main.innerHTML=`<div class=screen><button class=back id=statsBack>← 메인</button>

 <div class=section><div class=sectitle><span>가장 많이 성공한 고정 루틴</span></div>
 ${ranks.length?`<div class=statResult style="margin-top:7px;padding-left:10px">${ranks.filter(x=>x.done===ranks[0].done).map(x=>x.name).join(", ")}</div>`:'<div class=statLabel>아직 기록이 없어요.</div>'}</div>

 for(let x of ranks){let rp=x.possible?Math.round(x.done/x.possible*100):0;box.insertAdjacentHTML("beforeend",`<div class=statRow><div class=statName><span>${x.name}</span><span class=statResult>${x.done}회 · ${rp}%</span></div><div class=statBar><i style="width:${rp}%"></i></div></div>`)}
 $("#statsBack").onclick=renderHome;

}

async function loadCloud(){
 const pending=readPending();
 let rows,error;
 try{({data:rows,error}=await sb.from("plans").select("data").eq("user_id",currentUser.id).eq("plan_date","1970-01-01").maybeSingle())}
 catch(e){error=e}
 if(error){
  console.error("불러오기 실패:",error);
  if(!pending){alert("서버에서 기록을 불러오지 못했습니다. 기록 보호를 위해 다시 연결한 뒤 시도해 주세요.");return false}
 }
 data=pending||rows?.data||freshData();
 if(!data.recent)data.recent={};
 if(!data.routines)data.routines=freshData().routines;
 if(!data.days)data.days={};
 if(pending){saveRevision++;await flushSave()}
 else if(!rows&&!error)save();
 // On a new day, move unfinished opted-in tasks only when today's plan exists.
 // Confirm cloud persistence before updating the visible local snapshot.
 if(data.days[key(new Date())]){
  const needsCarry=Object.entries(data.days).some(([day,d])=>day<key(new Date())&&d.tasks?.some(t=>t.carry===true&&!t.done));
  if(needsCarry)await confirmCarryMutation(next=>carryToToday(next,false));
 }
 return true;
}

}
