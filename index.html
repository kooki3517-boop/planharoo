<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>계획장</title>
<style>
:root{--bg:#f5f0eb;--card:#fbf7f3;--ink:#494440;--muted:#8d8580;--line:#ddd3cd;--pink:#e5cbd0;--pink2:#eedcdf;--red:#ff1010}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--ink);height:100dvh;overflow:hidden}
button,input{font:inherit;color:inherit}.app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column}
header{padding:18px 18px 9px;display:flex;align-items:center;justify-content:space-between}h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-1px}.homeQuote{font-family:"Nanum Myeongjo","Noto Serif KR","Batang","바탕",serif;font-size:23px;font-weight:400;letter-spacing:-.5px}
.icon{border:0;background:transparent;font-size:22px;padding:7px}.sub{font-size:12px;color:var(--muted)}
main{flex:1;min-height:0}.home{height:100%;display:flex;flex-direction:column}.dateRow{padding:0 18px 10px;display:flex;justify-content:space-between;align-items:center}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:7px;padding:3px 12px 12px;flex:1;min-height:0;overflow:hidden}
.daycard{min-width:0;min-height:0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 8px;box-shadow:0 2px 10px #7766550a;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;overflow:hidden}
.daycard.today{border-color:#ddc4c8}.dow{font-size:10px;color:var(--muted);white-space:nowrap}.dateNum{font-size:21px;font-weight:700;margin:2px 0}.ratio{font-size:16px;margin-top:5px}.bar{height:5px;background:#eee8e4;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#d9bfc4;border-radius:9px}
.mini{display:block;margin-top:6px;font-size:9px;line-height:1.35;color:#827b77;overflow:hidden;max-height:27px}.mini div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hint{display:none}
nav{height:62px;border-top:1px solid var(--line);background:#faf7f4;display:flex}nav button{flex:1;border:0;background:none;font-size:12px;color:#99908c}nav button.on{color:#655d59;font-weight:700}
.screen{height:100%;overflow:auto;padding:0 18px 20px}.back{border:0;background:none;padding:8px 0;font-size:14px}.section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.sectitle{display:flex;justify-content:space-between;font-weight:700;margin-bottom:9px}
.task{display:flex;align-items:center;gap:9px;border-top:1px solid #eee8e4;padding:10px 0}.task:first-of-type{border-top:0}.task input{width:18px;height:18px;accent-color:#cdb2b7}.task.done .txt{text-decoration:line-through;color:#aaa}.txt{flex:1;font-size:14px}.smallbtn{border:0;background:none;color:#6f6662;padding:4px;font-weight:600}.recordActions{display:flex;gap:8px;margin-top:14px}.recordActions button{flex:1;border:1px solid var(--line);background:var(--card);padding:10px;border-radius:12px;color:#6f6662;font-weight:600}.recordActions .danger{color:#914d4d}.trashBtn{border:0;background:transparent;color:#7d706b;font-size:18px;padding:5px 7px;line-height:1;border-radius:9px}.trashBtn:active{background:#ebe3de}
.add{width:100%;border:1px dashed #d8cfca;background:#faf7f4;border-radius:14px;padding:12px;margin-top:8px}.progress{font-size:12px;color:#8d8580}
.manageRow{display:flex;gap:7px;align-items:center;border-top:1px solid #eee8e4;padding:9px 0}.drag{color:#bbb}.toggle{width:18px;height:18px;accent-color:#cdb2b7}
.historyGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hist{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;min-height:105px}.hist b{font-size:13px}.hist .ratio{font-size:16px}
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;pointer-events:none}.overlay.show{display:flex}.success{font-size:52px;font-weight:900;color:var(--red);letter-spacing:-2px;text-shadow:0 2px 0 #fff}
.conf{position:fixed;width:8px;height:13px;top:-20px;z-index:51;animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
.flash{position:fixed;inset:0;background:#000;z-index:100;display:none;align-items:center;justify-content:center}.flash img{width:100%;height:100%;object-fit:cover}
.modal{position:fixed;inset:0;background:#5d555044;z-index:40;display:flex;align-items:flex-end}.sheet{width:100%;max-width:520px;margin:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px;max-height:85vh;overflow:auto}
input[type=text]{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:12px}.rowbtn{display:flex;gap:8px;margin-top:8px}.rowbtn button{flex:1;border:1px solid var(--line);background:var(--card);padding:10px;border-radius:12px}

.inputModal{position:fixed;inset:0;background:#514a4538;z-index:80;display:none;align-items:flex-end;justify-content:center}
.inputModal.show{display:flex}.inputSheet{width:100%;max-width:520px;background:var(--bg);border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 28px #443a3320}
.inputSheet h3{margin:0 0 14px;font-size:18px}.inputSheet input{font-size:16px;outline:none}
.inputActions{display:flex;gap:8px;margin-top:12px}.inputActions button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px}.inputActions .primary{background:var(--pink2);border-color:#dec8cc}

.statsHead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.statsHead button{border:0;background:none;font-size:20px;padding:8px}
.statBig{font-size:32px;font-weight:700;margin:5px 0}.statLabel{font-size:12px;color:var(--muted)}
.statRow{padding:10px 0;border-top:1px solid var(--line)}.statRow:first-child{border-top:0}
.statName{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.statBar{height:6px;background:#eee6e1;border-radius:8px;overflow:hidden;margin-top:6px}.statBar i{display:block;height:100%;background:#d7b5bc;border-radius:8px}

/* Statistics: visually distinguish calculated result values from section headings */
.statBig{font-family:Arial,"Noto Sans KR",sans-serif;font-weight:800;letter-spacing:-.03em}
.statResult{font-family:Arial,"Noto Sans KR",sans-serif;font-weight:500;color:var(--muted);font-size:13px;line-height:1.45}
.statResultStrong{font-family:Arial,"Noto Sans KR",sans-serif;font-weight:700;color:var(--ink);font-size:16px;line-height:1.45;margin-top:7px}
</style><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#f7f3ef"></head>
<body><div class="app"><header><div><h1 id="appTitle" class="homeQuote">“나는 계획이 다 있구나.”</h1><div class="sub" id="monthLabel"></div></div><div style="display:flex;align-items:center"><button class="icon" id="statsBtn" aria-label="월간 통계">▥</button><button class="icon" id="gear">⚙</button></div></header><main id="main"></main><nav><button id="todayTab" class="on">오늘 계획</button></nav></div><div class="overlay" id="success"><div class="success">SUCCESS!</div></div><div class="inputModal" id="inputModal"><div class="inputSheet"><h3 id="inputTitle">할 일 추가</h3><input id="inputField" type="text" autocomplete="off"><div class="inputActions"><button id="inputCancel">취소</button><button class="primary" id="inputOk">확인</button></div></div></div><div class="flash" id="flash"><img id="flashImg"></div>
<script>
const DEFAULTS=["일어나서 영양제 챙겨 먹기","8시간 자기","감사 일기 쓰기","명상하기","독서하기 (10분 이상)","운동하기","건강식 한 끼","가계부 쓰기"];
const $=s=>document.querySelector(s), main=$("#main");
let data=JSON.parse(localStorage.getItem("planharoo_v4")||"null")||{routines:DEFAULTS.map((t,i)=>({id:"r"+i,t,on:true})),days:{}}; if(!data.recent)data.recent={};
function save(){localStorage.setItem("planharoo_v4",JSON.stringify(data))} function touchDay(k){data.recent[k]=Date.now();save()}
const pad=n=>String(n).padStart(2,"0"), key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function dayData(k){if(!data.days[k]) data.days[k]={routineDone:{},tasks:[]};return data.days[k]}
function activeR(){return data.routines.filter(x=>x.on)}
function counts(k){let d=dayData(k),r=activeR(),done=r.filter(x=>d.routineDone[x.id]).length+d.tasks.filter(x=>x.done).length,total=r.length+d.tasks.length;return [done,total]}
let ctx;
function audio(){ctx ||= new (window.AudioContext||window.webkitAudioContext)();return ctx}
function tone(freq=660,d=.09,vol=.22){try{let c=audio(),t=c.currentTime;
let b=c.createBuffer(1,Math.floor(c.sampleRate*.07),c.sampleRate),a=b.getChannelData(0);
for(let i=0;i<a.length;i++){let x=i/a.length;a[i]=(Math.random()*2-1)*Math.pow(1-x,5)}
let s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type="bandpass";f.frequency.value=1450;f.Q.value=1.8;g.gain.value=.48;s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);
let o=c.createOscillator(),og=c.createGain();o.type="square";o.frequency.setValueAtTime(165,t);o.frequency.exponentialRampToValueAtTime(90,t+.045);og.gain.setValueAtTime(.16,t);og.gain.exponentialRampToValueAtTime(.001,t+.055);o.connect(og);og.connect(c.destination);o.start(t);o.stop(t+.06)
}catch(e){}}
function cheer(){try{let c=audio(),t=c.currentTime;for(let j=0;j<14;j++){let o=c.createOscillator(),g=c.createGain();o.type="triangle";o.frequency.value=300+Math.random()*700;g.gain.setValueAtTime(.10,t+j*.018);g.gain.exponentialRampToValueAtTime(.001,t+.8+Math.random()*.5);o.connect(g);g.connect(c.destination);o.start(t+j*.018);o.stop(t+1.4)}for(let j=0;j<9;j++){let b=c.createBuffer(1,c.sampleRate*.09,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);let s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=.24;s.connect(g);g.connect(c.destination);s.start(t+.12+j*.13)}}catch(e){}}
function celebrate(){let ov=$("#success");ov.classList.add("show");cheer();for(let i=0;i<70;i++){let e=document.createElement("i");e.className="conf";e.style.left=Math.random()*100+"vw";e.style.background=`hsl(${Math.random()*360} 65% 68%)`;e.style.setProperty("--dx",(Math.random()*180-90)+"px");e.style.animationDelay=Math.random()*.25+"s";document.body.append(e);setTimeout(()=>e.remove(),2200)}setTimeout(()=>ov.classList.remove("show"),1900)}
function maybeSuccess(k,before){let [a,t]=counts(k);if(t>0&&a===t&&!before)celebrate()}
let askResolve=null;
function askInput(title,value=""){return new Promise(resolve=>{askResolve=resolve;$("#inputTitle").textContent=title;$("#inputField").value=value;$("#inputModal").classList.add("show");setTimeout(()=>$("#inputField").focus(),50)})}
$("#inputCancel").onclick=()=>{$("#inputModal").classList.remove("show");if(askResolve){askResolve(null);askResolve=null}};
$("#inputOk").onclick=()=>{let v=$("#inputField").value;$("#inputModal").classList.remove("show");if(askResolve){askResolve(v);askResolve=null}};
$("#inputField").addEventListener("keydown",e=>{if(e.key==="Enter")$("#inputOk").click()});

let center=new Date();center.setHours(12,0,0,0);
function renderHome(){$("#appTitle").className="homeQuote";$("#appTitle").textContent="“나는 계획이 다 있구나.”";
main.innerHTML='<div class="home"><div class="dateRow"><span class="sub">최근 계획</span><button class="icon" id="cal">▣</button></div><div class="cards" id="cards"></div></div>';
let box=$("#cards"), today=new Date();today.setHours(12,0,0,0);
let yesterday=new Date(today);yesterday.setDate(yesterday.getDate()-1);
let list=[yesterday,today].map(d=>({d,k:key(d),stamp:data.recent?.[key(d)]||0}));
for(let {d,k} of list){
 let dd=dayData(k),[done,total]=counts(k),r=activeR(),pct=total?done/total*100:0;
 let taskTexts=dd.tasks.map(x=>(x.done?"✓ ":"○ ")+x.t);
 let routineTexts=r.map(x=>(dd.routineDone[x.id]?"✓ ":"○ ")+x.t);
 let preview=[...taskTexts,...routineTexts].slice(0,2);
 let card=document.createElement("div");card.className="daycard"+(k===key(today)?" today":"");
 card.innerHTML=`<div><div class=dow>${d.getMonth()+1}.${d.getDate()} · ${["일","월","화","수","목","금","토"][d.getDay()]}</div><div class=ratio>${done}<span class=sub> / ${total}</span></div><div class=bar><i style="width:${pct}%"></i></div><div class=mini>${preview.map(x=>`<div>${x}</div>`).join("")}</div></div>`;
 card.onclick=()=>{touchDay(k);renderDetail(k)};box.append(card)
}
$("#cal").onclick=async()=>{let v=await askInput("날짜 이동 (YYYY-MM-DD)",key(today));if(/^\\d{4}-\\d{2}-\\d{2}$/.test(v||"")){touchDay(v);renderDetail(v)}};
setMonth()}
function renderDetail(k){$("#appTitle").className="";$("#appTitle").textContent="오늘은 이렇게,";let d=dayData(k),r=activeR(),[done,total]=counts(k);main.innerHTML=`<div class=screen><button class=back id=back>← 메인</button><div class=dateRow style="padding:4px 0 8px"><b>${k}</b><span style="display:flex;align-items:center;gap:7px"><span class=progress>${done}/${total} 완료</span><button class=trashBtn id=deleteRecord aria-label="이 날짜 기록 전체 삭제" title="이 날짜 기록 전체 삭제">🗑</button></span></div><div class=section><div class=sectitle><span>고정 루틴</span><span class=progress>${r.filter(x=>d.routineDone[x.id]).length}/${r.length}</span></div><div id=rs></div></div><div class=section><div class=sectitle><span>오늘만 할 일</span><span class=progress>${d.tasks.filter(x=>x.done).length}/${d.tasks.length}</span></div><div id=ts></div><button class=add id=add>+ 할 일 추가</button></div></div>`;$("#back").onclick=renderHome;r.forEach(x=>{$("#rs").insertAdjacentHTML("beforeend",`<label class="task ${d.routineDone[x.id]?"done":""}"><input type=checkbox data-r="${x.id}" ${d.routineDone[x.id]?"checked":""}><span class=txt>${x.t}</span></label>`)});d.tasks.forEach((x,i)=>{$("#ts").insertAdjacentHTML("beforeend",`<div class="task ${x.done?"done":""}"><input type=checkbox data-t="${i}" ${x.done?"checked":""}><span class=txt>${x.t}</span><button class=smallbtn data-e="${i}">수정</button><button class=smallbtn data-x="${i}">삭제</button></div>`)});main.querySelectorAll("[data-r]").forEach(el=>el.onchange=()=>{let was=counts(k)[0]===counts(k)[1]&&counts(k)[1]>0;d.routineDone[el.dataset.r]=el.checked;tone(el.checked?760:470,.11,.28);touchDay(k);maybeSuccess(k,was);renderDetail(k)});main.querySelectorAll("[data-t]").forEach(el=>el.onchange=()=>{let was=counts(k)[0]===counts(k)[1]&&counts(k)[1]>0;d.tasks[+el.dataset.t].done=el.checked;tone(el.checked?760:470,.11,.28);touchDay(k);maybeSuccess(k,was);renderDetail(k)});main.querySelectorAll("[data-e]").forEach(el=>el.onclick=()=>{let i=+el.dataset.e;(async()=>{let v=await askInput("할 일 수정",d.tasks[i].t);if(v?.trim()){d.tasks[i].t=v.trim();tone();touchDay(k);location.reload()}})()});main.querySelectorAll("[data-x]").forEach(el=>el.onclick=()=>{d.tasks.splice(+el.dataset.x,1);tone(380,.08,.2);touchDay(k);location.reload()});$("#deleteRecord").onclick=()=>{if(confirm(k+" 기록 전체를 삭제할까요?")){delete data.days[k];delete data.recent[k];save();tone(380,.08,.2);location.reload()}};$("#add").onclick=()=>{(async()=>{let v=await askInput("오늘 할 일 추가");if(v?.trim()){d.tasks.push({t:v.trim(),done:false});tone();touchDay(k);renderDetail(k)}})()}}
function renderManage(){$("#appTitle").className="homeQuote";$("#appTitle").textContent="“나는 계획이 다 있구나.”";main.innerHTML=`<div class=screen><button class=back id=back>← 메인</button><h2 style="font-size:19px">고정 루틴 관리</h2><div class=sub>켜 둔 항목은 새로운 날짜의 하루 계획 상단에 표시됩니다.</div><div class=section id=mr></div><button class=add id=addR>+ 새 고정 루틴 추가하기</button></div>`;$("#back").onclick=renderHome;data.routines.forEach((x,i)=>{$("#mr").insertAdjacentHTML("beforeend",`<div class=manageRow><span class=drag>☰</span><input class=toggle type=checkbox data-on="${i}" ${x.on?"checked":""}><span class=txt>${x.t}</span><button class=smallbtn data-up="${i}">↑</button><button class=smallbtn data-down="${i}">↓</button><button class=smallbtn data-re="${i}">✎</button><button class=smallbtn data-rx="${i}">×</button></div>`)});main.querySelectorAll("[data-on]").forEach(e=>e.onchange=()=>{data.routines[+e.dataset.on].on=e.checked;tone(e.checked?760:470,.11,.28);save();renderManage()});main.querySelectorAll("[data-re]").forEach(e=>e.onclick=()=>{let i=+e.dataset.re;(async()=>{let v=await askInput("고정 루틴 수정",data.routines[i].t);if(v?.trim()){data.routines[i].t=v.trim();tone();save();location.reload()}})()});main.querySelectorAll("[data-rx]").forEach(e=>e.onclick=()=>{data.routines.splice(+e.dataset.rx,1);tone(380,.08,.2);save();location.reload()});main.querySelectorAll("[data-up]").forEach(e=>e.onclick=()=>move(+e.dataset.up,-1));main.querySelectorAll("[data-down]").forEach(e=>e.onclick=()=>move(+e.dataset.down,1));$("#addR").onclick=()=>{(async()=>{let v=await askInput("새 고정 루틴");if(v?.trim()){data.routines.push({id:"r"+Date.now(),t:v.trim(),on:true});tone();save();renderManage()}})()}}
function move(i,n){let j=i+n;if(j<0||j>=data.routines.length)return;[data.routines[i],data.routines[j]]=[data.routines[j],data.routines[i]];tone(560,.07,.18);save();renderManage()}
function renderHistory(){$("#appTitle").className="homeQuote";$("#appTitle").textContent="“나는 계획이 다 있구나.”";todayTab.classList.remove("on");historyTab.classList.add("on");let keys=Object.keys(data.days).sort().reverse();main.innerHTML=`<div class=screen><h2 style="font-size:19px;margin-top:6px">지난 기록</h2><div class=historyGrid id=hg></div></div>`;if(!keys.length)$("#hg").innerHTML='<div class=sub>아직 기록이 없어요.</div>';keys.forEach(k=>{let [a,t]=counts(k),e=document.createElement("div");e.className="hist";e.innerHTML=`<b>${k.slice(5).replace("-","월 ")}일</b><div class=ratio>${a}<span class=sub> / ${t}</span></div><div class=bar><i style="width:${t?a/t*100:0}%"></i></div>`;e.onclick=()=>renderDetail(k);$("#hg").append(e)});setMonth()}
function setMonth(){let d=center;$("#monthLabel").textContent=`${d.getFullYear()}년 ${d.getMonth()+1}월`}

let statMonth=new Date(); statMonth.setDate(1);
function monthKeys(d){
 let y=d.getFullYear(),m=d.getMonth(),last=new Date(y,m+1,0).getDate(),arr=[];
 for(let n=1;n<=last;n++)arr.push(`${y}-${pad(m+1)}-${pad(n)}`); return arr;
}
function renderStats(){
 $("#appTitle").className="homeQuote";$("#appTitle").textContent="“나는 계획이 다 있구나.”";
 let keys=monthKeys(statMonth), existing=keys.filter(k=>data.days[k]), checked=0,total=0,successDays=0;
 let routineCounts={}; data.routines.forEach(r=>routineCounts[r.id]={name:r.t,done:0,possible:0});
 for(let k of existing){
   let dd=data.days[k], c=counts(k); checked+=c[0]; total+=c[1]; if(c[1]>0&&c[0]===c[1])successDays++;
   for(let r of data.routines){ if(r.on){routineCounts[r.id].possible++; if(dd.routineDone?.[r.id])routineCounts[r.id].done++;} }
 }
 let pct=total?Math.round(checked/total*100):0;
 let ranks=Object.values(routineCounts).filter(x=>x.possible>0).sort((a,b)=>b.done-a.done);
 main.innerHTML=`<div class=screen><button class=back id=statsBack>← 메인</button>
 <div class=statsHead><button id=prevM>‹</button><b>${statMonth.getFullYear()}년 ${statMonth.getMonth()+1}월</b><button id=nextM>›</button></div>
 <div class=section><div class=statLabel>이번 달 계획 달성률</div><div class=statBig>${pct}%</div><div class=bar><i style="width:${pct}%"></i></div></div>
 <div class=section><div class=sectitle><span>SUCCESS한 날</span><span>${successDays}일</span></div><div class=statLabel>하루 계획을 전부 완료한 날</div></div>
 <div class=section><div class=sectitle><span>가장 많이 성공한 고정 루틴</span></div>
 ${ranks.length?`<div class=statResultStrong>${ranks[0].name}</div><div class=statResult>${ranks[0].done}회 완료</div>`:'<div class=statLabel>아직 기록이 없어요.</div>'}</div>
 <div class=section><div class=sectitle><span>고정 루틴별 달성</span></div><div id=routineStats></div></div></div>`;
