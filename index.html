<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘은 이렇게,</title>
<style>
:root{--bg:#f7f3ef;--card:#fbf9f6;--ink:#55504d;--muted:#9b9490;--line:#e5ded9;--pink:#ead7da;--pink2:#f2e6e7;--red:#ff1010}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--ink);height:100dvh;overflow:hidden}
button,input{font:inherit;color:inherit}.app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column}
header{padding:18px 18px 9px;display:flex;align-items:center;justify-content:space-between}h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-1px}
.icon{border:0;background:transparent;font-size:22px;padding:7px}.sub{font-size:12px;color:var(--muted)}
main{flex:1;min-height:0}.home{height:100%;display:flex;flex-direction:column}.dateRow{padding:0 18px 10px;display:flex;justify-content:space-between;align-items:center}
.cards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:3px 18px 16px;flex:1;align-items:stretch;scrollbar-width:none}.cards::-webkit-scrollbar{display:none}
.daycard{scroll-snap-align:start;flex:0 0 43%;min-width:145px;max-height:100%;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;box-shadow:0 3px 14px #7766550c;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.daycard.today{border-color:#ddc4c8}.dow{font-size:11px;color:var(--muted)}.dateNum{font-size:28px;font-weight:700;margin:3px 0}.ratio{font-size:20px;margin-top:12px}.bar{height:5px;background:#eee8e4;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#d9bfc4;border-radius:9px}
.mini{margin-top:12px;font-size:11px;line-height:1.7;color:#827b77;overflow:hidden}.mini div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hint{font-size:10px;color:#aaa19c;margin-top:12px}
nav{height:62px;border-top:1px solid var(--line);background:#faf7f4;display:flex}nav button{flex:1;border:0;background:none;font-size:12px;color:#99908c}nav button.on{color:#655d59;font-weight:700}
.screen{height:100%;overflow:auto;padding:0 18px 20px}.back{border:0;background:none;padding:8px 0;font-size:14px}.section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.sectitle{display:flex;justify-content:space-between;font-weight:700;margin-bottom:9px}
.task{display:flex;align-items:center;gap:9px;border-top:1px solid #eee8e4;padding:10px 0}.task:first-of-type{border-top:0}.task input{width:18px;height:18px;accent-color:#cdb2b7}.task.done .txt{text-decoration:line-through;color:#aaa}.txt{flex:1;font-size:14px}.smallbtn{border:0;background:none;color:#9c928e;padding:4px}
.add{width:100%;border:1px dashed #d8cfca;background:#faf7f4;border-radius:14px;padding:12px;margin-top:8px}.progress{font-size:12px;color:#8d8580}
.manageRow{display:flex;gap:7px;align-items:center;border-top:1px solid #eee8e4;padding:9px 0}.drag{color:#bbb}.toggle{width:18px;height:18px;accent-color:#cdb2b7}
.historyGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hist{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;min-height:105px}.hist b{font-size:13px}.hist .ratio{font-size:16px}
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;pointer-events:none}.overlay.show{display:flex}.success{font-size:52px;font-weight:900;color:var(--red);letter-spacing:-2px;text-shadow:0 2px 0 #fff}
.conf{position:fixed;width:8px;height:13px;top:-20px;z-index:51;animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
.flash{position:fixed;inset:0;background:#000;z-index:100;display:none;align-items:center;justify-content:center}.flash img{width:100%;height:100%;object-fit:cover}
.modal{position:fixed;inset:0;background:#5d555044;z-index:40;display:flex;align-items:flex-end}.sheet{width:100%;max-width:520px;margin:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px;max-height:85vh;overflow:auto}
input[type=text]{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:12px}.rowbtn{display:flex;gap:8px;margin-top:8px}.rowbtn button{flex:1;border:1px solid var(--line);background:var(--card);padding:10px;border-radius:12px}
</style><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#f7f3ef"></head>
<body><div class="app"><header><div><h1>오늘은 이렇게,</h1><div class="sub" id="monthLabel"></div></div><button class="icon" id="gear">⚙</button></header><main id="main"></main><nav><button id="todayTab" class="on">오늘 계획</button><button id="historyTab">지난 기록</button></nav></div><div class="overlay" id="success"><div class="success">SUCCESS!</div></div><div class="flash" id="flash"><img id="flashImg"></div>
<script>
const DEFAULTS=["일어나서 영양제 챙겨 먹기","8시간 자기","감사 일기 쓰기","명상하기","독서하기 (10분 이상)","운동하기","건강식 한 끼","가계부 쓰기"];
const $=s=>document.querySelector(s), main=$("#main");
let data=JSON.parse(localStorage.getItem("planharoo_v4")||"null")||{routines:DEFAULTS.map((t,i)=>({id:"r"+i,t,on:true})),days:{}};
function save(){localStorage.setItem("planharoo_v4",JSON.stringify(data))}
const pad=n=>String(n).padStart(2,"0"), key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function dayData(k){if(!data.days[k]) data.days[k]={routineDone:{},tasks:[]};return data.days[k]}
function activeR(){return data.routines.filter(x=>x.on)}
function counts(k){let d=dayData(k),r=activeR(),done=r.filter(x=>d.routineDone[x.id]).length+d.tasks.filter(x=>x.done).length,total=r.length+d.tasks.length;return [done,total]}
let ctx;
function audio(){ctx ||= new (window.AudioContext||window.webkitAudioContext)();return ctx}
function tone(freq=660,d=.09,vol=.22){try{let c=audio(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=freq;g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.start();o.stop(c.currentTime+d)}catch(e){}}
function cheer(){try{let c=audio(),t=c.currentTime;for(let j=0;j<14;j++){let o=c.createOscillator(),g=c.createGain();o.type="triangle";o.frequency.value=300+Math.random()*700;g.gain.setValueAtTime(.10,t+j*.018);g.gain.exponentialRampToValueAtTime(.001,t+.8+Math.random()*.5);o.connect(g);g.connect(c.destination);o.start(t+j*.018);o.stop(t+1.4)}for(let j=0;j<9;j++){let b=c.createBuffer(1,c.sampleRate*.09,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);let s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=.24;s.connect(g);g.connect(c.destination);s.start(t+.12+j*.13)}}catch(e){}}
function celebrate(){let ov=$("#success");ov.classList.add("show");cheer();for(let i=0;i<70;i++){let e=document.createElement("i");e.className="conf";e.style.left=Math.random()*100+"vw";e.style.background=`hsl(${Math.random()*360} 65% 68%)`;e.style.setProperty("--dx",(Math.random()*180-90)+"px");e.style.animationDelay=Math.random()*.25+"s";document.body.append(e);setTimeout(()=>e.remove(),2200)}setTimeout(()=>ov.classList.remove("show"),1900)}
function maybeSuccess(k,before){let [a,t]=counts(k);if(t>0&&a===t&&!before)celebrate()}
let center=new Date();center.setHours(12,0,0,0);
function renderHome(){main.innerHTML='<div class="home"><div class="dateRow"><span class="sub">날짜별 진행 상황</span><button class="icon" id="cal">▣</button></div><div class="cards" id="cards"></div></div>';let box=$("#cards");for(let off=-3;off<=7;off++){let d=new Date(center);d.setDate(d.getDate()+off);let k=key(d),dd=dayData(k),[done,total]=counts(k),r=activeR(),pct=total?done/total*100:0;let card=document.createElement("div");card.className="daycard"+(k===key(new Date())?" today":"");let preview=[...r.slice(0,2).map(x=>(dd.routineDone[x.id]?"✓ ":"○ ")+x.t),...dd.tasks.slice(0,1).map(x=>(x.done?"✓ ":"○ ")+x.t)];card.innerHTML=`<div><div class=dow>${["일","월","화","수","목","금","토"][d.getDay()]}요일 · ${d.getMonth()+1}월</div><div class=dateNum>${d.getDate()}</div><div class=ratio>${done}<span class=sub> / ${total}</span></div><div class=bar><i style="width:${pct}%"></i></div><div class=mini>${preview.map(x=>`<div>${x}</div>`).join("")}</div></div><div class=hint>눌러서 하루 계획 보기</div>`;card.onclick=()=>renderDetail(k);box.append(card)}setTimeout(()=>{let els=box.children;els[3]?.scrollIntoView({inline:"center",block:"nearest"})},0);$("#cal").onclick=()=>{let v=prompt("이동할 날짜 (YYYY-MM-DD)",key(center));if(/^\\d{4}-\\d{2}-\\d{2}$/.test(v||"")){center=new Date(v+"T12:00:00");renderHome()}};setMonth()}
function renderDetail(k){let d=dayData(k),r=activeR(),[done,total]=counts(k);main.innerHTML=`<div class=screen><button class=back id=back>← 메인</button><div class=dateRow style="padding:4px 0 8px"><b>${k}</b><span class=progress>${done}/${total} 완료</span></div><div class=section><div class=sectitle><span>고정 루틴</span><span class=progress>${r.filter(x=>d.routineDone[x.id]).length}/${r.length}</span></div><div id=rs></div></div><div class=section><div class=sectitle><span>오늘만 할 일</span><span class=progress>${d.tasks.filter(x=>x.done).length}/${d.tasks.length}</span></div><div id=ts></div><button class=add id=add>+ 할 일 추가</button></div></div>`;$("#back").onclick=renderHome;r.forEach(x=>{$("#rs").insertAdjacentHTML("beforeend",`<label class="task ${d.routineDone[x.id]?"done":""}"><input type=checkbox data-r="${x.id}" ${d.routineDone[x.id]?"checked":""}><span class=txt>${x.t}</span></label>`)});d.tasks.forEach((x,i)=>{$("#ts").insertAdjacentHTML("beforeend",`<div class="task ${x.done?"done":""}"><input type=checkbox data-t="${i}" ${x.done?"checked":""}><span class=txt>${x.t}</span><button class=smallbtn data-e="${i}">✎</button><button class=smallbtn data-x="${i}">×</button></div>`)});main.querySelectorAll("[data-r]").forEach(el=>el.onchange=()=>{let was=counts(k)[0]===counts(k)[1]&&counts(k)[1]>0;d.routineDone[el.dataset.r]=el.checked;tone(el.checked?760:470,.11,.28);save();maybeSuccess(k,was);renderDetail(k)});main.querySelectorAll("[data-t]").forEach(el=>el.onchange=()=>{let was=counts(k)[0]===counts(k)[1]&&counts(k)[1]>0;d.tasks[+el.dataset.t].done=el.checked;tone(el.checked?760:470,.11,.28);save();maybeSuccess(k,was);renderDetail(k)});main.querySelectorAll("[data-e]").forEach(el=>el.onclick=()=>{let i=+el.dataset.e,v=prompt("할 일 수정",d.tasks[i].t);if(v?.trim()){d.tasks[i].t=v.trim();tone(620,.08,.2);save();renderDetail(k)}});main.querySelectorAll("[data-x]").forEach(el=>el.onclick=()=>{d.tasks.splice(+el.dataset.x,1);tone(380,.08,.2);save();renderDetail(k)});$("#add").onclick=()=>{let v=prompt("오늘 할 일");if(v?.trim()){d.tasks.push({t:v.trim(),done:false});tone(650,.09,.24);save();renderDetail(k)}}}
function renderManage(){main.innerHTML=`<div class=screen><button class=back id=back>← 메인</button><h2 style="font-size:19px">고정 루틴 관리</h2><div class=sub>켜 둔 항목은 새로운 날짜의 하루 계획 상단에 표시됩니다.</div><div class=section id=mr></div><button class=add id=addR>+ 새 고정 루틴 추가하기</button></div>`;$("#back").onclick=renderHome;data.routines.forEach((x,i)=>{$("#mr").insertAdjacentHTML("beforeend",`<div class=manageRow><span class=drag>☰</span><input class=toggle type=checkbox data-on="${i}" ${x.on?"checked":""}><span class=txt>${x.t}</span><button class=smallbtn data-up="${i}">↑</button><button class=smallbtn data-down="${i}">↓</button><button class=smallbtn data-re="${i}">✎</button><button class=smallbtn data-rx="${i}">×</button></div>`)});main.querySelectorAll("[data-on]").forEach(e=>e.onchange=()=>{data.routines[+e.dataset.on].on=e.checked;tone(e.checked?760:470,.11,.28);save();renderManage()});main.querySelectorAll("[data-re]").forEach(e=>e.onclick=()=>{let i=+e.dataset.re,v=prompt("고정 루틴 수정",data.routines[i].t);if(v?.trim()){data.routines[i].t=v.trim();save();renderManage()}});main.querySelectorAll("[data-rx]").forEach(e=>e.onclick=()=>{data.routines.splice(+e.dataset.rx,1);tone(380,.08,.2);save();renderManage()});main.querySelectorAll("[data-up]").forEach(e=>e.onclick=()=>move(+e.dataset.up,-1));main.querySelectorAll("[data-down]").forEach(e=>e.onclick=()=>move(+e.dataset.down,1));$("#addR").onclick=()=>{let v=prompt("새 고정 루틴");if(v?.trim()){data.routines.push({id:"r"+Date.now(),t:v.trim(),on:true});tone(650,.09,.24);save();renderManage()}}}
function move(i,n){let j=i+n;if(j<0||j>=data.routines.length)return;[data.routines[i],data.routines[j]]=[data.routines[j],data.routines[i]];tone(560,.07,.18);save();renderManage()}
function renderHistory(){todayTab.classList.remove("on");historyTab.classList.add("on");let keys=Object.keys(data.days).sort().reverse();main.innerHTML=`<div class=screen><h2 style="font-size:19px;margin-top:6px">지난 기록</h2><div class=historyGrid id=hg></div></div>`;if(!keys.length)$("#hg").innerHTML='<div class=sub>아직 기록이 없어요.</div>';keys.forEach(k=>{let [a,t]=counts(k),e=document.createElement("div");e.className="hist";e.innerHTML=`<b>${k.slice(5).replace("-","월 ")}일</b><div class=ratio>${a}<span class=sub> / ${t}</span></div><div class=bar><i style="width:${t?a/t*100:0}%"></i></div>`;e.onclick=()=>renderDetail(k);$("#hg").append(e)});setMonth()}
function setMonth(){let d=center;$("#monthLabel").textContent=`${d.getFullYear()}년 ${d.getMonth()+1}월`}
$("#gear").onclick=renderManage;$("#todayTab").onclick=()=>{todayTab.classList.add("on");historyTab.classList.remove("on");center=new Date();center.setHours(12,0,0,0);renderHome()};$("#historyTab").onclick=renderHistory;
function easter(){if(Math.random()>=.05)return;let imgs=["assets/20403.jpg","assets/20460.jpg","assets/20574.webp","assets/20603.jpg","assets/20784.webp","assets/20964.jpg","assets/22550.jpg","assets/23443.jpg","assets/23842.jpg","assets/34450.jpg","assets/34794.jpg","assets/38062.jpg","assets/39653.jpg","assets/40251.jpg","assets/5309.jpg","assets/50776.jpg","assets/50805.jpg","assets/51420.jpg","assets/58412.jpg","assets/57339.jpg","assets/57077.jpg","assets/57061.jpg"];let f=$("#flash");$("#flashImg").src=imgs[Math.floor(Math.random()*imgs.length)];f.style.display="flex";setTimeout(()=>f.style.display="none",700)}
renderHome();easter();
</script></body></html>
