<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4f1"><title>오늘은 이렇게,</title><style>
:root{--bg:#f7f4f1;--paper:#fbf9f7;--line:#e9e2df;--ink:#302d2b;--muted:#aaa3a0;--pink:#d8c3c6;--pink2:#efe6e7;--red:#f00000}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;padding:24px 18px 96px}.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}.top h1{margin:0;flex:1;font-size:27px;font-weight:800;letter-spacing:-.6px}.icon{border:0;background:transparent;color:#8f8986;font-size:23px;padding:8px}.subdate{font-size:14px;color:#817b78;margin:0 2px 12px}.memoRail{display:flex;gap:13px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -18px;padding:3px 18px 16px}.memoRail::-webkit-scrollbar{display:none}.memoCard{flex:0 0 82%;scroll-snap-align:start;border:1px solid var(--line);background:rgba(255,255,255,.48);border-radius:20px;padding:17px;min-height:290px;text-align:left;color:var(--ink);box-shadow:0 4px 16px rgba(72,58,53,.025)}.memoCard.today{background:#fbf8f7;border-color:#dfd1d2}.memoDate{font-size:13px;color:#918a87;margin-bottom:5px}.memoCard h2{font-size:20px;margin:0 0 13px}.miniProgress{height:6px;background:#eee8e5;border-radius:9px;overflow:hidden;margin:8px 0 16px}.miniProgress i{display:block;height:100%;background:var(--pink)}.previewTitle{font-size:13px;font-weight:700;color:#7c7572;margin:11px 0 6px}.preview{font-size:13px;color:#8e8784;line-height:1.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hint{text-align:center;color:#b0aaa7;font-size:12px;margin-top:2px}.card{background:rgba(255,255,255,.47);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:13px}.progressHead,.sectionHead{display:flex;align-items:center;justify-content:space-between}.progressHead strong{font-size:17px}.count{font-size:13px;color:#9e9794}.bar{height:7px;border-radius:9px;background:#eee8e5;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pink)}.sectionHead{margin-bottom:9px}.sectionHead h2{font-size:16px;margin:0}.task{display:grid;grid-template-columns:30px 1fr 30px 30px;gap:6px;align-items:center;min-height:48px;border-top:1px solid #eee8e5}.task:first-of-type{border-top:0}.check{width:23px;height:23px;border:1px solid #c9c1be;border-radius:6px;background:#fff;color:#fff}.check.on{background:#ccb4b8;border-color:#ccb4b8}.task.done .txt{text-decoration:line-through;color:#b6afac}.txt{font-size:15px}.miniBtn{border:0;background:none;color:#aaa3a0;font-size:18px}.add{width:100%;border:1px dashed #dfd6d3;background:rgba(255,255,255,.27);border-radius:16px;padding:15px;color:#9e9794;font-size:15px}.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(250,247,245,.97);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}.tabs button{width:min(50%,260px);border:0;background:none;padding:11px 4px calc(13px + env(safe-area-inset-bottom));color:#aaa3a0;font-size:14px}.tabs .active{color:#a9878d;border-bottom:4px solid #c8aeb2}.hidden{display:none!important}.month{width:100%;border:1px solid var(--line);background:#f0ebe8;border-radius:15px;padding:14px 16px;color:#77706d;font-size:16px;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.historyCard{border:1px solid var(--line);background:rgba(255,255,255,.43);border-radius:17px;padding:14px;min-height:145px}.historyCard h3{font-size:16px;margin:0 0 8px}.histLine{font-size:12px;color:#918a87;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.7}.histScore{text-align:right;color:#aaa3a0;font-size:12px;margin-top:7px}.note{font-size:13px;line-height:1.55;color:#928b88;background:#f0eae7;border-radius:15px;padding:14px;margin-bottom:14px}.routineRow{display:grid;grid-template-columns:25px 38px 1fr 30px 30px;gap:5px;align-items:center;min-height:54px;border-bottom:1px solid #eee8e5}.routineRow:last-child{border-bottom:0}.drag{color:#b7b0ad;cursor:grab;font-size:20px}.switch{width:34px;height:20px;border:0;border-radius:20px;background:#ddd6d3;padding:2px}.switch i{display:block;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}.switch.on{background:#d1b8bc}.switch.on i{transform:translateX(14px)}.offtxt{color:#b9b2af}.back{font-size:28px}.success{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;pointer-events:none;background:transparent}.success.show{display:flex}.success span{font-weight:1000;font-size:clamp(56px,18vw,105px);color:var(--red);letter-spacing:1px}.confetti{position:fixed;z-index:101;top:-25px;width:9px;height:15px;animation:fall 1.7s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(800deg)}}.flash{position:fixed;inset:0;z-index:200;display:none;background:#111;align-items:center;justify-content:center}.flash.show{display:flex}.flash img{width:100%;height:100%;object-fit:cover}.empty{color:#aaa3a0;font-size:14px;padding:8px 0}@media(max-width:380px){.app{padding-left:14px;padding-right:14px}.top h1{font-size:25px}.memoRail{margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}}
</style></head><body><main class="app">
<section id="home"><div class="top"><h1>오늘은 이렇게,</h1><button class="icon" id="calendarBtn" aria-label="달력">▣</button><button class="icon" onclick="showManage()" aria-label="고정 루틴 관리">⚙</button></div><div id="homeDate" class="subdate"></div><div id="memoRail" class="memoRail"></div><div class="hint">좌우로 넘겨 날짜를 보고, 카드를 누르면 하루 계획이 열립니다.</div><input id="datePicker" type="date" style="position:absolute;opacity:0;pointer-events:none"></section>
<section id="detail" class="hidden"><div class="top"><button class="icon back" onclick="show('home')">‹</button><h1>하루 계획</h1><button class="icon" onclick="showManage()">⚙</button></div><div id="detailDate" class="subdate"></div><div id="detailBody"></div></section>
<section id="history" class="hidden"><div class="top"><h1>지난 기록</h1></div><input id="month" class="month" type="month"><div id="historyGrid" class="grid"></div></section>
<section id="manage" class="hidden"><div class="top"><button class="icon back" onclick="show('home')">‹</button><h1>고정 루틴 관리</h1></div><div class="note">여기에서 정한 항목은 새로운 날짜를 만들 때마다 항상 상단에 표시됩니다. 기존 기록에는 영향을 주지 않습니다.</div><div id="routineManage" class="card"></div><button class="add" onclick="addRoutine()">＋ 새 고정 루틴 추가하기</button></section>
</main><nav id="tabs" class="tabs"><button id="tabToday" class="active" onclick="show('home')">⌂<br>오늘 계획</button><button id="tabHistory" onclick="show('history')">▣<br>지난 기록</button></nav><div id="success" class="success"><span>SUCCESS!</span></div><div id="flash" class="flash"><img id="flashImg" alt=""></div>
<script>
const DEFAULTS=['일어나서 영양제 챙겨 먹기','8시간 자기','감사 일기 쓰기','명상하기','독서하기 (10분 이상)','운동하기','건강식 한 끼','가계부 쓰기'];
const PHOTOS=['34450.jpg','34794.jpg','38062.jpg','39653.jpg','40251.jpg','5309.jpg','50776.jpg','50805.jpg','51420.jpg','58412.jpg','57339.jpg','57077.jpg','57061.jpg'];
const STORE='planharoo-final-v1';let state=JSON.parse(localStorage.getItem(STORE)||'null')||{routines:DEFAULTS.map(text=>({text,enabled:true})),days:{}};let selected=key(new Date());
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function parse(k){let[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)}function save(){localStorage.setItem(STORE,JSON.stringify(state))}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function label(k){let d=parse(k);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${['일','월','화','수','목','금','토'][d.getDay()]})`}function offset(k,n){let d=parse(k);d.setDate(d.getDate()+n);return key(d)}
function ensure(k){if(!state.days[k]){state.days[k]={routines:state.routines.filter(r=>r.enabled).map(r=>({text:r.text,done:false})),daily:[]};save()}return state.days[k]}
function sound(kind='tap'){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);let f={check:610,uncheck:360,toggle:470,edit:540,delete:260,enter:690,open:500,close:330}[kind]||460;o.frequency.value=f;g.gain.setValueAtTime(.025,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+(kind==='delete'?.12:.065));o.start();o.stop(a.currentTime+(kind==='delete'?.12:.065))}catch(e){}}
function renderHome(){homeDate.textContent=label(key(new Date()));let ks=[];for(let i=-3;i<=3;i++)ks.push(offset(selected,i));memoRail.innerHTML=ks.map(k=>{let d=ensure(k),all=[...d.routines,...d.daily],n=all.filter(x=>x.done).length,dt=parse(k),today=k===key(new Date());return `<button class="memoCard ${today?'today':''}" data-date="${k}" onclick="openDay('${k}')"><div class="memoDate">${label(k)}</div><h2>${today?'오늘의 계획':`${dt.getMonth()+1}월 ${dt.getDate()}일 계획`}</h2><div class="count">${n}/${all.length} 완료</div><div class="miniProgress"><i style="width:${all.length?n/all.length*100:0}%"></i></div><div class="previewTitle">고정 루틴</div>${d.routines.slice(0,4).map(x=>`<div class="preview">${x.done?'✓':'□'} ${esc(x.text)}</div>`).join('')}${d.daily.length?`<div class="previewTitle">오늘만 할 일</div>${d.daily.slice(0,3).map(x=>`<div class="preview">${x.done?'✓':'□'} ${esc(x.text)}</div>`).join('')}`:''}</button>`}).join('');requestAnimationFrame(()=>memoRail.children[3]?.scrollIntoView({inline:'center',block:'nearest'}))}
let st;memoRail.addEventListener('scroll',()=>{clearTimeout(st);st=setTimeout(()=>{let r=memoRail.getBoundingClientRect(),cx=r.left+r.width/2,b=null,dist=1e9;[...memoRail.children].forEach(el=>{let q=el.getBoundingClientRect(),x=Math.abs(q.left+q.width/2-cx);if(x<dist){dist=x;b=el}});if(b&&b.dataset.date!==selected){selected=b.dataset.date;renderHome()}},130)});
function openDay(k){selected=k;ensure(k);sound('open');show('detail')}
function renderDetail(){let d=ensure(selected),all=[...d.routines,...d.daily],n=all.filter(x=>x.done).length;detailDate.textContent=label(selected);detailBody.innerHTML=`<div class="card"><div class="progressHead"><strong>${parse(selected).getMonth()+1}월 ${parse(selected).getDate()}일</strong><span class="count">${n}/${all.length}</span></div><div class="bar"><i style="width:${all.length?n/all.length*100:0}%"></i></div></div><div class="card">${section('고정 루틴',d.routines,'routines')}</div><div class="card">${section('오늘만 할 일',d.daily,'daily')}</div><button class="add" onclick="addDaily()">＋ 오늘만 할 일 추가하기</button>`}
function section(title,arr,type){let n=arr.filter(x=>x.done).length;return `<div class="sectionHead"><h2>${title}</h2><span class="count">${n}/${arr.length}</span></div>${arr.length?arr.map((x,i)=>`<div class="task ${x.done?'done':''}"><button class="check ${x.done?'on':''}" onclick="toggle('${type}',${i})">${x.done?'✓':''}</button><span class="txt">${esc(x.text)}</span><button class="miniBtn" onclick="editItem('${type}',${i})">✎</button><button class="miniBtn" onclick="delItem('${type}',${i})">×</button></div>`).join(''):'<div class="empty">등록된 항목이 없습니다.</div>'}`}
function toggle(type,i){let d=ensure(selected);d[type][i].done=!d[type][i].done;save();sound(d[type][i].done?'check':'uncheck');renderDetail();let all=[...d.routines,...d.daily];if(all.length&&all.every(x=>x.done))celebrate()}
function editItem(type,i){let d=ensure(selected),v=prompt('내용 수정',d[type][i].text);if(v&&v.trim()){d[type][i].text=v.trim();save();sound('edit');renderDetail()}}
function delItem(type,i){let d=ensure(selected);if(confirm('삭제할까요?')){d[type].splice(i,1);save();sound('delete');renderDetail()}}
function addDaily(){let v=prompt('오늘만 할 일을 입력하세요.');if(v&&v.trim()){ensure(selected).daily.push({text:v.trim(),done:false});save();sound('enter');renderDetail()}}
function show(id){['home','detail','history','manage'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));tabs.style.display=(id==='manage'||id==='detail')?'none':'flex';tabToday.classList.toggle('active',id==='home');tabHistory.classList.toggle('active',id==='history');if(id==='home'){sound('close');renderHome()}if(id==='detail')renderDetail();if(id==='history')renderHistory();if(id==='manage')renderManage()}
function showManage(){sound('open');show('manage')}
function renderManage(){routineManage.innerHTML=state.routines.map((r,i)=>`<div class="routineRow ${r.enabled?'':'offtxt'}" draggable="true" data-i="${i}"><span class="drag">☷</span><button class="switch ${r.enabled?'on':''}" onclick="toggleRoutine(${i})"><i></i></button><span>${esc(r.text)}</span><button class="miniBtn" onclick="editRoutine(${i})">✎</button><button class="miniBtn" onclick="deleteRoutine(${i})">×</button></div>`).join('');bindDrag()}
function toggleRoutine(i){state.routines[i].enabled=!state.routines[i].enabled;save();sound('toggle');renderManage()}
function addRoutine(){let v=prompt('새 고정 루틴을 입력하세요.');if(v&&v.trim()){state.routines.push({text:v.trim(),enabled:true});save();sound('enter');renderManage()}}
function editRoutine(i){let v=prompt('고정 루틴 수정',state.routines[i].text);if(v&&v.trim()){state.routines[i].text=v.trim();save();sound('edit');renderManage()}}
function deleteRoutine(i){if(confirm('이 고정 루틴을 삭제할까요?')){state.routines.splice(i,1);save();sound('delete');renderManage()}}
function bindDrag(){let from=null;routineManage.querySelectorAll('.routineRow').forEach(row=>{row.addEventListener('dragstart',()=>from=+row.dataset.i);row.addEventListener('dragover',e=>e.preventDefault());row.addEventListener('drop',e=>{e.preventDefault();let to=+row.dataset.i;if(from===null||from===to)return;let [x]=state.routines.splice(from,1);state.routines.splice(to,0,x);save();sound('toggle');renderManage()})})}
function renderHistory(){let m=month.value||selected.slice(0,7);month.value=m;let ks=Object.keys(state.days).filter(k=>k.startsWith(m)).sort().reverse();historyGrid.innerHTML=ks.length?ks.map(k=>{let d=state.days[k],all=[...d.routines,...d.daily],n=all.filter(x=>x.done).length,dt=parse(k);return `<div class="historyCard" onclick="openDay('${k}')"><h3>${dt.getMonth()+1}.${dt.getDate()} (${['일','월','화','수','목','금','토'][dt.getDay()]})</h3>${all.slice(0,5).map(x=>`<div class="histLine">${x.done?'✓':'□'} ${esc(x.text)}</div>`).join('')}<div class="histScore">${n}/${all.length}</div></div>`}).join(''):'<div class="empty">기록이 없습니다.</div>'}
month.addEventListener('change',renderHistory);calendarBtn.onclick=()=>{datePicker.value=selected;datePicker.showPicker?datePicker.showPicker():datePicker.click()};datePicker.onchange=()=>{selected=datePicker.value;ensure(selected);renderHome()};
function celebrate(){success.classList.add('show');try{let a=new(window.AudioContext||window.webkitAudioContext)();[0,70,140,220,300].forEach((ms,j)=>setTimeout(()=>{let o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=[520,660,780,920,1050][j];g.gain.setValueAtTime(.045,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.2);o.start();o.stop(a.currentTime+.2)},ms))}catch(e){}for(let i=0;i<60;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=`hsl(${Math.random()*360} 65% 65%)`;c.style.animationDelay=Math.random()*.45+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2400)}setTimeout(()=>success.classList.remove('show'),1900)}
ensure(selected);renderHome();if(Math.random()<.05){flashImg.src='assets/'+PHOTOS[Math.floor(Math.random()*PHOTOS.length)];flash.classList.add('show');setTimeout(()=>flash.classList.remove('show'),700)}
</script></body></html>
