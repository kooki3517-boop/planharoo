<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f1ef"><link rel="manifest" href="manifest.webmanifest"><title>하루 계획</title><style>
:root{--bg:#f5f1ef;--card:#faf8f6;--line:#e7dfdc;--ink:#171717;--muted:#8d8987;--pink:#d8c1c4;--pink2:#eadbdd;--red:#ef1717}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding:22px 18px 96px}.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}.top h1{font-size:27px;margin:0;flex:1}.icon{border:0;background:none;font-size:25px;color:#777}.date,.month{width:100%;border:0;border-radius:14px;background:#eee9e7;padding:16px 18px;font-size:18px;color:#666;margin-bottom:18px}.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(250,248,246,.96);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}.tabs button{width:min(50%,380px);padding:14px 8px 18px;border:0;background:none;font-size:15px;color:#8d8987}.tabs .active{color:#b58e94;border-bottom:4px solid #c9a7ad}.row{display:grid;grid-template-columns:34px 32px 1fr 28px 28px;gap:8px;align-items:center;padding:17px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.32);margin:9px 0}.row.done .txt{text-decoration:line-through;color:#aaa}.check{width:26px;height:26px;border:1px solid #aaa;border-radius:4px;background:white}.check.on{background:var(--pink);color:white;border-color:var(--pink);font-size:18px}.txt{font-size:17px}.add{margin-top:18px;width:100%;padding:18px;border:1px solid var(--line);border-radius:14px;background:transparent;color:#999;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.daycard{background:rgba(255,255,255,.38);border:1px solid var(--line);border-radius:15px;padding:14px;min-height:180px}.daycard h3{margin:0;font-size:18px}.dow{color:#999;margin:3px 0 10px}.mini{font-size:14px;line-height:1.8;color:#777}.mini b{color:#777}.score{text-align:right;color:#999}.panel{background:#f1e9e7;border-radius:14px;padding:16px;color:#777;line-height:1.6;margin-bottom:16px}.manage .row{grid-template-columns:28px 32px 1fr 28px 28px}.drag{color:#999}.hidden{display:none}.success{position:fixed;inset:0;background:rgba(255,255,255,.88);z-index:99;display:none;align-items:center;justify-content:center;font-weight:900;font-size:clamp(52px,16vw,110px);color:var(--red);letter-spacing:2px}.success.show{display:flex}.photoFlash{position:fixed;inset:0;z-index:90;background:#000;display:none;align-items:center;justify-content:center}.photoFlash.show{display:flex}.photoFlash img{width:100%;height:100%;object-fit:cover}.confetti{position:fixed;top:-20px;width:10px;height:16px;background:#e33;z-index:100;animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}.gearbox{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;z-index:50}.gearbox.show{display:flex}.modal{width:min(90vw,420px);background:#faf8f6;border-radius:18px;padding:20px}.modal h2{margin-top:0}.toggle{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}@media(max-width:430px){.app{padding:18px 14px 90px}.top h1{font-size:25px}.row{grid-template-columns:30px 30px 1fr 26px 26px;padding:15px 9px}.grid{gap:9px}.daycard{padding:12px}}
</style></head><body><main class="app">
<section id="today"><div class="top"><button class="icon">‹</button><h1>하루 계획</h1><button class="icon" onclick="settings(true)">⚙</button></div><input id="date" class="date" type="date"><div id="list"></div><button class="add" onclick="addTask()">＋ 할 일 추가하기 (Enter로 빠르게 추가)</button></section>
<section id="history" class="hidden"><div class="top"><h1>지난 기록</h1><button class="icon">▣</button><button class="icon">⋮</button></div><input id="month" class="month" type="month"><div id="cards" class="grid"></div></section>
<section id="manage" class="hidden"><div class="top"><button class="icon" onclick="show('today')">‹</button><h1>고정 루틴 관리</h1><button class="icon">?</button></div><div class="panel">여기에서 선택한 항목은 새로운 날짜를 만들 때마다 항상 상단에 표시돼. 기존 기록에는 영향을 주지 않아.</div><div id="routineList" class="manage"></div><button class="add" onclick="addRoutine()">＋ 새 고정 루틴 추가하기</button></section>
</main><nav class="tabs"><button id="tabToday" class="active" onclick="show('today')">⌂<br>오늘 계획</button><button id="tabHistory" onclick="show('history')">▣<br>지난 기록</button></nav><div id="photoFlash" class="photoFlash"><img id="flashImg"></div><div id="success" class="success">SUCCESS</div><div id="settings" class="gearbox" onclick="if(event.target===this)settings(false)"><div class="modal"><h2>설정</h2><div class="toggle"><span>효과음</span><input id="sound" type="checkbox" checked></div><div class="toggle"><span>사진 플래시 (새로고침 시 5%)</span><span>5%</span></div><button class="add" onclick="settings(false);show('manage')">고정 루틴 관리</button></div></div>
<script>
const A=['20403.jpg','20460.jpg','20574.webp','20603.jpg','20784.webp','20964.jpg','22550.jpg','23443.jpg','23842.jpg','34450.jpg','34794.jpg','38062.jpg','39653.jpg','40251.jpg','5309.jpg','50776.jpg','50805.jpg','51420.jpg','58412.jpg','57339.jpg','57077.jpg','57061.jpg'];
let routines=JSON.parse(localStorage.getItem('routines')||'["영양제 챙겨 먹기","물 2L 마시기","책 30분 읽기","운동하기"]');
const key=d=>'day:'+d; const today=new Date();
function iso(d){return d.toISOString().slice(0,10)} function state(d){let s=JSON.parse(localStorage.getItem(key(d))||'null');if(!s)s={tasks:routines.map(t=>({t,done:false,r:true}))};return s} function save(d,s){localStorage.setItem(key(d),JSON.stringify(s))}
function beep(kind='click'){if(!document.querySelector('#sound').checked)return;let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=kind==='success'?660:kind==='off'?260:480;g.gain.value=.045;o.start();o.stop(a.currentTime+(kind==='success'?.22:.06))}
function render(){let d=date.value,s=state(d),el=list;el.innerHTML='';s.tasks.forEach((x,i)=>{let r=document.createElement('div');r.className='row '+(x.done?'done':'');r.innerHTML=`<span>${String(i+1).padStart(2,'0')}</span><button class="check ${x.done?'on':''}" onclick="toggle(${i})">${x.done?'✓':''}</button><span class="txt">${x.t}</span><button class="icon" onclick="editTask(${i})">✎</button><button class="icon" onclick="delTask(${i})">♙</button>`;el.append(r)});}
function toggle(i){let s=state(date.value);s.tasks[i].done=!s.tasks[i].done;save(date.value,s);beep(s.tasks[i].done?'click':'off');render(); if(s.tasks.length&&s.tasks.every(x=>x.done))win()}
function addTask(){let t=prompt('할 일을 입력해');if(!t)return;let s=state(date.value);if(s.tasks.length>=30)return;s.tasks.push({t,done:false,r:false});save(date.value,s);beep();render()}
function editTask(i){let s=state(date.value),t=prompt('수정',s.tasks[i].t);if(t){s.tasks[i].t=t;save(date.value,s);render();beep()}}
function delTask(i){let s=state(date.value);s.tasks.splice(i,1);save(date.value,s);render();beep('off')}
function win(){beep('success');let x=document.querySelector('#success');x.classList.add('show');for(let i=0;i<55;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.5+'s';c.style.transform=`rotate(${Math.random()*360}deg)`;document.body.append(c);setTimeout(()=>c.remove(),2400)}setTimeout(()=>x.classList.remove('show'),1800)}
function show(id){['today','history','manage'].forEach(x=>document.querySelector('#'+x).classList.toggle('hidden',x!==id));tabToday.classList.toggle('active',id==='today');tabHistory.classList.toggle('active',id==='history');if(id==='history')renderHistory();if(id==='manage')renderRoutines();beep()}
function renderHistory(){let m=month.value||iso(today).slice(0,7),days=[];for(let i=0;i<31;i++){let d=new Date(m+'-01T12:00:00');d.setDate(d.getDate()+i);if(iso(d).slice(0,7)!==m)break;let k=iso(d),s=JSON.parse(localStorage.getItem(key(k))||'null');if(s)days.push([k,s])}cards.innerHTML=days.reverse().map(([d,s])=>`<div class="daycard" onclick="date.value='${d}';show('today');render()"><h3>${+d.slice(8)}일</h3><div class="dow">${['일요일','월요일','화요일','수요일','목요일','금요일','토요일'][new Date(d+'T12:00').getDay()]}</div><div class="mini">${s.tasks.slice(0,5).map(x=>`${x.done?'☑':'□'} ${x.t}`).join('<br>')}</div><div class="score">${s.tasks.filter(x=>x.done).length} / ${s.tasks.length}</div></div>`).join('')||'<div style="color:#999">기록이 없어.</div>'}
function renderRoutines(){routineList.innerHTML=routines.map((t,i)=>`<div class="row"><span class="drag">☰</span><button class="check on">✓</button><span>${t}</span><button class="icon" onclick="editRoutine(${i})">✎</button><button class="icon" onclick="delRoutine(${i})">♙</button></div>`).join('')}
function addRoutine(){let t=prompt('새 고정 루틴');if(t){routines.push(t);localStorage.setItem('routines',JSON.stringify(routines));renderRoutines();beep()}}function editRoutine(i){let t=prompt('수정',routines[i]);if(t){routines[i]=t;localStorage.setItem('routines',JSON.stringify(routines));renderRoutines()}}function delRoutine(i){routines.splice(i,1);localStorage.setItem('routines',JSON.stringify(routines));renderRoutines();beep('off')}
function settings(v){document.querySelector('#settings').classList.toggle('show',v)}
date.value=iso(today);month.value=iso(today).slice(0,7);date.onchange=render;month.onchange=renderHistory;render();
// 5% refresh photo flash: brief enough to recognize, then disappears.
if(Math.random()<.05){let f=photoFlash,img=flashImg;img.src='assets/'+A[Math.floor(Math.random()*A.length)];f.classList.add('show');setTimeout(()=>f.classList.remove('show'),900)}
</script></body></html>
